name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['8.1', '8.2', '8.3', '8.4', '8.5']

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, sqlite3, pdo_sqlite, mbstring
          tools: composer:v2
          coverage: none
          ini-values: error_reporting=E_ALL, zend.exception_ignore_args=0

      - name: PHP info
        run: |
          php -v
          php -m

      - name: Validate composer.json
        run: composer validate --no-interaction

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Dump autoload (optimize)
        run: composer dump-autoload -o

      - name: Run PHPUnit
        run: vendor/bin/phpunit --display-deprecations --fail-on-warning --fail-on-risky

      - name: Check website documentation
        run: |
          find website -name '*.php' -print0 | xargs -0 -n1 php -l
          php website/tests/docs-check.php

  databases:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: dbf_test
          MYSQL_DATABASE: dbf_test
        ports: ['3306:3306']
        options: --health-cmd="mysqladmin ping -h localhost -pdbf_test" --health-interval=10s --health-timeout=5s --health-retries=10
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: dbf_test
          POSTGRES_DB: dbf_test
        ports: ['5432:5432']
        options: --health-cmd="pg_isready -U postgres" --health-interval=10s --health-timeout=5s --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: pdo_mysql, pdo_pgsql, pdo_sqlite, mbstring
          tools: composer:v2
      - run: composer install --no-interaction --prefer-dist --no-progress
      - run: vendor/bin/phpunit --filter DriverTest --fail-on-warning --fail-on-risky
        env:
          DBF_TEST_MYSQL: mysql:host=127.0.0.1;port=3306;dbname=dbf_test
          DBF_TEST_PGSQL: pgsql:host=127.0.0.1;port=5432;dbname=dbf_test
